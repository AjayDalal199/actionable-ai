<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget host</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      button {
        background: red !important;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Host page</h1>
    <p>The red button is the host. The chat control is the widget.</p>
    <button type="button">Host button</button>
    <script src="/widget.js"></script>
    <script>
      const params = new URLSearchParams(location.search)
      A2I.registerTool("preview_ping", function (args) {
        return { echoed: args }
      })
      A2I.init({
        workspace: params.get("workspace") || "00000000-0000-0000-0000-000000000000",
        token: params.get("token"),
      })
    </script>
  </body>
</html>
