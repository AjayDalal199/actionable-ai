name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      date:
        description: Release date in YYYY-MM-DD format. Defaults to today.
        required: false
        type: string

permissions: {}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
      - name: Prepare release
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_DATE: ${{ inputs.date }}
        run: uv run python scripts/prepare_release.py prepare "$BUMP" --date "$RELEASE_DATE"
      - name: Get release version
        id: release-version
        run: |
          version="$(uv run python scripts/prepare_release.py current-version)"
          echo "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create release pull request
        env:
          BASE_BRANCH: master
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          branch="release-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add release-notes.md backend/pyproject.toml
          git commit -m "🔖 Release version ${VERSION}"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          gh label create release \
            --description "Release preparation" \
            --color ededed \
            --force
          uv run python scripts/prepare_release.py release-notes > /tmp/release-body.md
          {
            echo "Prepare release ${VERSION}."
            echo
            cat /tmp/release-body.md
          } > /tmp/pr-body.md
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "🔖 Release version ${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label release
