name: Deploy

# FastAPI Cloud is not the A²I host. Kept so the template file is not resurrected
# by accident; this workflow never runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disabled
        run: echo "FastAPI Cloud deploy is disabled"
