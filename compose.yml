services:

  proxy:
    image: traefik:v3.7
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    # Postgres 18 plus pgvector. Existing Postgres 18 volumes can stay.
    image: pgvector/pgvector:pg18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  redis:
    # Ephemeral. HITL pauses live here later; documents stay in Postgres.
    # No host port in this file. compose.override.yml publishes 6380 for local pytest.
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.http.routers.${STACK_NAME:-a2i}-adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.${STACK_NAME:-a2i}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME:-a2i}-adminer-http.service=${STACK_NAME:-a2i}-adminer
      - traefik.http.services.${STACK_NAME:-a2i}-adminer.loadbalancer.server.port=8080

  backend:
    image: backend:${STACK_NAME:-a2i}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gemini-3.5-flash-lite}
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
      SENTRY_DSN: ${SENTRY_DSN:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      # Original uploads on the VM boot disk. Docker's data root is already there.
      - knowledge-uploads:/data/knowledge

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.services.${STACK_NAME:-a2i}-backend.loadbalancer.server.port=8000
      - traefik.http.routers.${STACK_NAME:-a2i}-backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.${STACK_NAME:-a2i}-backend-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME:-a2i}-backend-http.service=${STACK_NAME:-a2i}-backend

volumes:
  app-db-data:
  knowledge-uploads:
