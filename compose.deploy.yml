services:

  proxy:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-certificates:/certificates
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-ops@dactionlabs.com}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog
      - --log

  db:
    restart: always

  redis:
    restart: always

  adminer:
    profiles:
      - adminer
    restart: always
    labels:
      - traefik.http.routers.${STACK_NAME:?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN:?Variable not set}`)
      - traefik.http.routers.${STACK_NAME:?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME:?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME:?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME:?Variable not set}-adminer-https.service=${STACK_NAME:?Variable not set}-adminer

  backend:
    restart: always
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    labels:
      - traefik.http.routers.${STACK_NAME:?Variable not set}-backend-https.rule=Host(`${DOMAIN:?Variable not set}`)
      - traefik.http.routers.${STACK_NAME:?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME:?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME:?Variable not set}-backend-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME:?Variable not set}-backend-https.service=${STACK_NAME:?Variable not set}-backend

volumes:
  traefik-certificates:
